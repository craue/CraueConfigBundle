name: Tests

on:
  pull_request: ~
  push: ~

concurrency:
  group: ${{ github.workflow }} @ ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies || format('Symfony {0}', matrix.symfony) }}${{ (matrix.allow-failure && ' 🔕') || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure || false }}
    env:
      COMPOSER_NO_BLOCKING: 1
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
      SYMFONY_DEPRECATIONS_HELPER: ${{ matrix.symfony-deprecations }}

    strategy:
      fail-fast: false
      matrix:
        include:
          -
            php: '8.2'
            dependencies: lowest
            symfony-deprecations: max[direct]=246&max[indirect]=190
          -
            php: '8.5'
            dependencies: highest
          -
            php: '8.2'
            symfony: '5.4.*'
          -
            php: '8.2'
            symfony: '6.4.*'
          -
            php: '8.3'
            symfony: '6.4.*'
          -
            php: '8.4'
            symfony: '6.4.*'
          -
            php: '8.5'
            symfony: '6.4.*'
          -
            php: '8.5'
            symfony: '7.4.*'
          -
            php: '8.5'
            symfony: '8.2.*'
            stability: dev
            allow-failure: true

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: set up MySQL
        run: |
          sudo systemctl start mysql
          echo '
            CREATE DATABASE IF NOT EXISTS test;
            DROP USER IF EXISTS "tester"@"localhost";
            CREATE USER "tester"@"localhost" IDENTIFIED WITH mysql_native_password BY "";
            GRANT ALL ON test.* TO "tester"@"localhost";
            FLUSH PRIVILEGES;
          ' > /tmp/mysql-init.sql
          mysql --user=root --password=root -e 'source /tmp/mysql-init.sql'

      - name: checkout
        uses: actions/checkout@v7

      - name: setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysql, redis
          coverage: pcov
          ini-values: memory_limit=-1
          tools: flex
        env:
          fail-fast: true # interrupt on extension setup error

      - name: use dev dependencies
        if: matrix.stability == 'dev'
        run: composer config minimum-stability dev

      - name: install dependencies with Composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-dist

      - name: run PHPUnit
        run: vendor/bin/phpunit -v --coverage-clover build/logs/clover.xml
        env:
          REDIS_DSN: redis://localhost:6379

      - name: upload code coverage data to Coveralls
        if: github.repository == 'craue/CraueConfigBundle'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          flag-name: PHP ${{ matrix.php }} - ${{ matrix.dependencies || format('Symfony {0}', matrix.symfony) }}
          parallel: true

  notify-coveralls:
    name: (notify Coveralls)
    needs: tests
    if: ${{ always() && github.repository == 'craue/CraueConfigBundle' }}
    runs-on: ubuntu-latest

    steps:
      - name: notify Coveralls to finish the build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
