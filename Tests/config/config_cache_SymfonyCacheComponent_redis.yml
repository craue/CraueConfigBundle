imports:
  - { resource: config.yml }

services:
  my_redis_provider:
    class: \Redis
    factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
    arguments:
      - '%env(REDIS_DSN)%'
  craue_config_cache:
    class: Symfony\Component\Cache\Adapter\RedisAdapter
    public: false
    arguments:
      - '@my_redis_provider'
      - 'craue_config'
