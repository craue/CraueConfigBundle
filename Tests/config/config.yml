imports:
  - { resource: '@IntegrationTestBundle/Resources/config/controller.yml' }
  - { resource: config_hacks.php }

doctrine:
  dbal:
    charset: UTF8
    driver: ~
    host: 127.0.0.1
    port: ~
    dbname: test
    user: tester
    password: ~
  orm:
    auto_mapping: true

framework:
  assets: ~
  form: ~
  profiler:
    enabled: true
    collect: false
  router:
    resource: '%kernel.project_dir%/Tests/config/routing.yml'
  secret: whatever
  session:
    handler_id: ~
    storage_factory_id: session.storage.factory.mock_file
  test: ~
  translator:
    fallback: en

twig:
  debug: '%kernel.debug%'
  strict_variables: '%kernel.debug%'

services:
  twig.test:
    alias: twig
    public: true
